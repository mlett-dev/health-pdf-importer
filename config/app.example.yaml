folders:
  inbox: data/inbox
  processing: data/processing
  done: data/done
  review: data/review
  error: data/error

file_naming:
  # Verfuegbare Platzhalter:
  #   {date}              -> Rechnungsdatum (z.B. 2026_04_15)
  #   {patient}           -> Patienten-Vorname (z.B. Max)
  #   {topic}             -> Rechnungs-Thema (z.B. Arztbesuch)
  #   {doctor}            -> Voller Arztname inkl. Titel (z.B. Dr._Testarzt)
  #   {doctor_last_name}  -> Arzt-Nachname ohne Titel (z.B. Testarzt)
  #   {total_amount_eur}  -> Gesamtbetrag als "123,45"
  pattern: "{date}_{patient}_{topic}.pdf"
  date_format: "%Y_%m_%d"
  max_topic_length: 60

ollama:
  base_url: http://127.0.0.1:11434
  text_model: qwen3.6:35b-a3b-q8_0
  vision_model: qwen3.6:35b-a3b-q8_0
  timeout_seconds: 300

pdf:
  min_text_chars: 500
  ocr_language: deu+eng
  render_dpi: 220
  max_vision_pages: 3
  min_area_ratio: 0.01
  min_pixel_width: 80
  min_pixel_height: 40
  force_vision: false

confidence:
  auto_create_min: 0.85
  review_min: 0.60
  required_fields_min: 0.80

anytype:
  # NEVER commit your real config/app.yaml. Copy this file and fill in your values.
  space_id: "<your-space-id>"
  collection_name: "Wahlarzt Rechnungen"
  collection_id: "<your-collection-id>"
  custom_type_name: "Wahlarztrechnung"
  custom_type_key: wahlarztrechnung
  gkk_property_id: "<your-gkk-property-id>"
  pkv_property_id: "<your-pkv-property-id>"
  pkv_eingereicht_property_id: "<your-pkv-eingereicht-property-id>"
  attachment_property_id: "<your-attachment-property-id>"
  done_property_id: "<your-done-property-id>"
  patient_tag_property_id: "<your-patient-tag-property-id>"
  amount_property_id: "<your-amount-property-id>"
  date_property_id: "<your-date-property-id>"
  doctor_property_id: "<your-doctor-property-id>"
  extension_command: anytype-extension-mcp-wrapper
  patients:
    - name: Max
      tag: "<your-max-tag-id>"
      aliases:
        - Maximilian
    - name: Anna
      tag: "<your-anna-tag-id>"
  # change to false for production
  dry_run: true 

logging:
  level: INFO
  trace_full_text: false

privacy:
  store_extracted_text: false
  store_full_text_debug: false
  write_sidecar_json: true
  sidecar_policy: always
  allow_external_services: false

state_db:
  path: data/state.sqlite

# Optional: Kassen-PDF Namensschema (default: enabled mit Pattern {date}_{patient}_GKK_{topic}.pdf)
# Verfuegbare Platzhalter:
#   {date}              -> Bescheidsdatum (z.B. 2026_04_15)
#   {service_date}      -> Leistungsdatum / betreffender Termin (z.B. 2026_04_08)
#   {patient}           -> Patienten-Vorname (z.B. Max)
#   {topic}             -> Thema der zugehoerigen Rechnung (aus Anytype-Objektname des Matches; Fallback: Arztname)
#   {doctor}            -> Voller Arztname inkl. Titel (z.B. Dr._Testarzt)
#   {doctor_last_name}  -> Arzt-Nachname ohne Titel (z.B. Testarzt)
#   {total_amount_eur}  -> Erstattungsbetrag als "123,45"
# kassen_file_naming:
#   enabled: true
#   pattern: "{date}_{patient}_GKK_{topic}.pdf"
#   date_format: "%Y_%m_%d"
#   max_topic_length: 40

# Optional: Pkv-PDF Namensschema (default: enabled mit Pattern {date}_{patient}_PKV.pdf)
# Verfuegbare Platzhalter:
#   {date}              -> Bescheidsdatum (z.B. 2026_04_15)
#   {service_date}      -> Leistungsdatum / betreffender Termin (z.B. 2026_04_08)
#   {patient}           -> Patienten-Vorname (z.B. Max)
#   {topic}             -> Thema der zugehoerigen Rechnung (aus Anytype-Objektname des Matches; Fallback: Arztname)
#   {doctor}            -> Voller Arztname inkl. Titel (z.B. Dr._Testarzt)
#   {doctor_last_name}  -> Arzt-Nachname ohne Titel (z.B. Testarzt)
#   {total_amount_eur}  -> Erstattungsbetrag als "123,45"
# pkv_file_naming:
#   enabled: true
#   pattern: "{date}_{patient}_PKV_{topic}.pdf"
#   date_format: "%Y_%m_%d"
#   max_topic_length: 40

# Optional: Befund-/Patientenbrief-Namensschema
# Verfuegbare Platzhalter: {date} {patient} {doctor} {doctor_last_name}
# befund_file_naming:
#   enabled: true
#   pattern: "{date}_{doctor_last_name}_{patient}_Brief.pdf"
#   date_format: "%Y_%m_%d"

# Optional: Schwelle, ab der ein Befund automatisch an eine Rechnung angehaengt wird.
# Strenger als kassen_match, weil nur Patient, Arzt und Termin bewertet werden.
# befund_match:
#   auto_match_min: 0.90

# Optional: Namen privater Krankenversicherer als Hinweis fuer die document_type-Erkennung
# pkv_insurers:
#   names:
#     - Uniqua
#     - Donau
#     - Merkur

# Optional: Kassen-Matching Thresholds (default: auto_match_min=0.90, review_match_min=0.60)
# kassen_match:
#   auto_match_min: 0.90
#   review_match_min: 0.60

